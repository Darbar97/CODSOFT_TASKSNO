    <text x="16" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a1a1aa">Interactive pointer tilt</text>
    <rect x="16" y="64" width="148" height="28" rx="6" fill="#18181b" />
    <text x="90" y="82" font-family="monospace, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">&lt;Card3D maxTilt={6} /&gt;</text>

    <!-- Mini Card 2 -->
    <rect x="198" y="0" width="180" height="110" rx="10" fill="#27272a" fill-opacity="0.6" stroke="#3f3f46" stroke-width="0.8" />
    <text x="214" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fafaf9">Core Web Vitals</text>
    <text x="214" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a1a1aa">LCP, INP, CLS telemetry</text>
    <rect x="214" y="64" width="148" height="28" rx="6" fill="#064e3b" />
    <text x="288" y="82" font-family="monospace, monospace" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">Score: 100 Good</text>

    <!-- Mini Card 3 -->
    <rect x="396" y="0" width="180" height="110" rx="10" fill="#27272a" fill-opacity="0.6" stroke="#3f3f46" stroke-width="0.8" />
    <text x="412" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fafaf9">Official Records</text>
    <text x="412" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#a1a1aa">PDF Resume &amp; Degrees</text>
    <rect x="412" y="64" width="148" height="28" rx="6" fill="#18181b" />
    <text x="486" y="82" font-family="monospace, monospace" font-size="10" fill="#facc15" text-anchor="middle">Enrolment: 23C11086</text>
  </g>
