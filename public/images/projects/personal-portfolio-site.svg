    <text x="58" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#09090b" text-anchor="middle">PP</text>
    
    <!-- Verified Dot -->
    <circle cx="86" cy="86" r="8" fill="#10b981" stroke="#27272a" stroke-width="2" />

    <!-- Name & Titles -->
    <text x="108" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#fafaf9">Premkumar Parmar</text>
    <text x="108" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Frontend Developer &amp; AI Enthusiast</text>
    <text x="108" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#a1a1aa">Computer Science &amp; Engineering Student • Halol, Gujarat</text>

    <!-- Tech Stack Row -->
    <g transform="translate(24, 106)">
      <rect x="0" y="0" width="80" height="24" rx="6" fill="#3f3f46" />
      <text x="40" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f4f4f5" text-anchor="middle">React 19</text>

      <rect x="90" y="0" width="88" height="24" rx="6" fill="#3f3f46" />
      <text x="134" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Tailwind v4</text>

      <rect x="188" y="0" width="94" height="24" rx="6" fill="#3f3f46" />
      <text x="235" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">TypeScript</text>

      <rect x="292" y="0" width="86" height="24" rx="6" fill="#3f3f46" />
      <text x="335" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Motion 3D</text>

