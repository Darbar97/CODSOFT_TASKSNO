<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-port" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad-port" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="640" height="360" rx="16" fill="url(#bg-grad-port)" />
  <rect x="0.5" y="0.5" width="639" height="359" rx="15.5" stroke="#27272a" stroke-width="1" />

  <!-- Browser Header Bar -->
  <rect x="0" y="0" width="640" height="44" rx="16" fill="#18181b" fill-opacity="0.95" />
  <rect x="0" y="32" width="640" height="12" fill="#18181b" fill-opacity="0.95" />
  <line x1="0" y1="44" x2="640" y2="44" stroke="#27272a" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="28" cy="22" r="5" fill="#ef4444" />
  <circle cx="44" cy="22" r="5" fill="#f59e0b" />
  <circle cx="60" cy="22" r="5" fill="#10b981" />

  <!-- URL Bar -->
  <rect x="84" y="11" width="410" height="22" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <text x="96" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a1a1aa">https://personal-portfolio-zeta-three-20.vercel.app</text>

